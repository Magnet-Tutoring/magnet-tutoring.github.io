# Render Blueprint for Magnet Tutoring.
#
# One Node web service (serves the static site + API + admin dashboard) and one
# managed Postgres database. This file is PROVIDED for the owner to deploy from;
# applying it is a manual step (see docs/DEPLOY.md). No real secrets live here:
# SESSION_SECRET is generated by Render, ADMIN_EMAIL is set by the owner in the
# dashboard, and DATABASE_URL is wired from the managed database below.
services:
  - type: web
    name: magnet-tutoring
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: magnet-tutoring-db
          property: connectionString

databases:
  - name: magnet-tutoring-db
    plan: free
